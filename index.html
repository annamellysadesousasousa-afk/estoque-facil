<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque Fácil</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{margin:0;background:#f0f7f4;color:#111}
header{background:linear-gradient(135deg,#2563eb,#16a34a);color:#fff;padding:20px 16px;text-align:center}
header h1{margin:0;font-size:26px} header p{margin:6px 0 0;opacity:.9}
main{max-width:520px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
h2{font-size:17px;margin:0 0 10px}
label{font-size:13px;font-weight:600;display:block;margin-top:8px}
input,select{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:12px;margin-top:4px;font-size:15px}
button{width:100%;padding:13px;border:0;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
.btn-green{background:#16a34a;color:#fff}.btn-blue{background:#2563eb;color:#fff}.btn-gray{background:#e5e7eb}
.row{display:flex;gap:8px}.row button{flex:1}
.prod{border:1px solid #eee;border-radius:12px;padding:10px;margin-top:8px}
.low{color:#dc2626;font-weight:700;font-size:12px;background:#fee2e2;padding:3px 8px;border-radius:20px}
.muted{color:#666;font-size:13px}
.kpis{display:flex;gap:10px}.kpi{flex:1;background:#fff;border-radius:14px;padding:12px;text-align:center}
.kpi span{display:block;font-size:12px;color:#666}.kpi strong{font-size:18px}
</style>
</head>
<body>
<header><h1>📦 Estoque Fácil</h1><p>Controle de estoque da sua lojinha</p></header>
<main>
<div class="kpis"><div class="kpi"><span>Total de produtos</span><strong id="kpiProd">0</strong></div><div class="kpi"><span>Total vendido</span><strong id="kpiVendas">R$ 0,00</strong></div></div>
<div class="card"><h2>➕ Cadastrar produto</h2>
<label>Nome do produto</label><input id="nome" placeholder="Ex: Caderno">
<label>Preço (R$)</label><input id="preco" type="number" step="0.01" placeholder="Ex: 20,00">
<label>Quantidade</label><input id="qtd" type="number" placeholder="Ex: 10">
<button class="btn-green" onclick="salvar()">Salvar produto</button></div>
<div class="card"><h2>🔍 Pesquisar</h2><input id="busca" placeholder="Digite o nome..." oninput="render()"></div>
<div class="card"><h2>📋 Produtos</h2><div id="lista"></div></div>
<div class="card"><h2>🛒 Simular venda</h2>
<label>Escolha o produto</label><select id="selProduto"></select>
<label>Quantidade</label><input id="qtdVenda" type="number" value="1" min="1">
<button class="btn-blue" onclick="vender()">Registrar venda</button>
<p class="muted" id="msgVenda"></p></div>
<div class="card"><h2>🧾 Últimas vendas</h2><div id="historico"></div>
<button class="btn-gray" onclick="zerar()">Apagar tudo</button></div>
</main>
<script>
let produtos = JSON.parse(localStorage.getItem('ef_produtos')||'[]');
let vendas = JSON.parse(localStorage.getItem('ef_vendas')||'[]');
if(produtos.length===0 && vendas.length===0){
 produtos=[{id:1,nome:'Caderno',preco:20,qtd:10},{id:2,nome:'Caneta Azul',preco:3.5,qtd:25}];
 salvarStorage();
}
function salvarStorage(){localStorage.setItem('ef_produtos',JSON.stringify(produtos));localStorage.setItem('ef_vendas',JSON.stringify(vendas));}
function fmt(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function salvar(){
 const nome=document.getElementById('nome').value.trim();
 const preco=parseFloat(document.getElementById('preco').value);
 const qtd=parseInt(document.getElementById('qtd').value);
 if(!nome||isNaN(preco)||isNaN(qtd)){alert('Preencha nome, preço e quantidade!');return;}
 produtos.push({id:Date.now(),nome,preco,qtd});
 salvarStorage(); document.getElementById('nome').value='';document.getElementById('preco').value='';document.getElementById('qtd').value=''; render();
}
function excluir(id){if(confirm('Excluir?')){produtos=produtos.filter(x=>x.id!==id);salvarStorage();render();}}
function vender(){
 const id=parseFloat(document.getElementById('selProduto').value);
 const q=parseInt(document.getElementById('qtdVenda').value);
 let p=produtos.find(x=>x.id===id);
 if(!p){alert('Escolha um produto');return;}
 if(q>p.qtd){alert('Estoque insuficiente! Tem só '+p.qtd);return;}
 p.qtd-=q; let total=q*p.preco; vendas.unshift({nome:p.nome,q,total,data:new Date().toLocaleString('pt-BR')});
 salvarStorage(); render();
 document.getElementById('msgVenda').innerHTML='✅ Venda: '+q+'x '+p.nome+' = <b>'+fmt(total)+'</b>';
}
function zerar(){if(confirm('Apagar tudo?')){localStorage.removeItem('ef_produtos');localStorage.removeItem('ef_vendas');location.reload();}}
function render(){
 const busca=document.getElementById('busca').value.toLowerCase();
 const lista=document.getElementById('lista'); lista.innerHTML='';
 let filtrados=produtos.filter(p=>p.nome.toLowerCase().includes(busca));
 if(filtrados.length===0) lista.innerHTML='<p class="muted">Nenhum produto.</p>';
 filtrados.forEach(p=>{
   lista.innerHTML+=`<div class="prod"><b>${p.nome}</b> ${p.qtd<5?'<span class="low">⚠️ ESTOQUE BAIXO</span>':''}<div class="muted">${fmt(p.preco)} • ${p.qtd} unidades</div><div class="row"><button class="btn-gray" onclick="excluir(${p.id})">Excluir</button></div></div>`;
 });
 const sel=document.getElementById('selProduto'); sel.innerHTML=produtos.map(p=>`<option value="${p.id}">${p.nome} - ${fmt(p.preco)} (${p.qtd})</option>`).join('');
 document.getElementById('kpiProd').textContent=produtos.length;
 document.getElementById('kpiVendas').textContent=fmt(vendas.reduce((s,v)=>s+v.total,0));
 document.getElementById('historico').innerHTML=vendas.length? vendas.slice(0,10).map(v=>`<div class="muted">• ${v.q}x ${v.nome} = ${fmt(v.total)} <br><small>${v.data}</small></div>`).join('') : '<p class="muted">Nenhuma venda ainda.</p>';
}
render();
</script>
</body>
</html>
